<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="t d">
<title id="t">PS5 Agent Remote architecture</title><desc id="d">The browser page and an MCP agent share one local server. The server owns the single Remote Play session through ps5bridge.dll, finds and wakes the console over UDP, and calls Sony only for PSN lookups.</desc>
