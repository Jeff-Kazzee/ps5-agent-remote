<text x="129" y="122" font-size="12.5" fill="#59636e" text-anchor="middle">live view, typing</text>
<rect x="44" y="200" width="170" height="72" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2"/>
<text x="129" y="224" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">mcp_server.py</text>
<text x="129" y="242" font-size="12.5" fill="#59636e" text-anchor="middle">nine tools for</text>
<text x="129" y="260" font-size="12.5" fill="#59636e" text-anchor="middle">an MCP client</text>
<rect x="280" y="120" width="170" height="90" rx="10" fill="#f6f8fa" stroke="#0b5cd5" stroke-width="2"/>
